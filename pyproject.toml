[project]
name = "mpremote-sync"
version = "0.1.0"
description = "Verify and sync Python files to a MicroPython device via mpremote"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "ambadran", email = "ambadran717@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Hardware",
]

[project.scripts]
mpremote-sync = "mpremote_sync:main"

[project.urls]
Repository = "https://github.com/ambadran/mpremote-sync"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
